name: PulsePass CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  stage-1-lint-and-typecheck:
    name: "Estágio 1: Análise Estática & Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './app_build/package.json'

      - name: Install Dependencies
        run: |
          cd app_build
          npm install

      - name: Run TypeScript Strict Type-Check (Backend)
        run: |
          cd app_build/backend
          npm run typecheck

      - name: Run TypeScript Strict Type-Check (Frontend)
        run: |
          cd app_build/frontend
          npm run typecheck

  stage-2-unit-tests:
    name: "Estágio 2: Testes Unitários de Domínio (FSM & Idempotência)"
    needs: stage-1-lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './app_build/package.json'

      - name: Install Dependencies
        run: |
          cd app_build
          npm install

      - name: Execute FSM & Domain Unit Tests with Coverage
        run: |
          cd app_build/backend
          npm run test:coverage

  stage-3-integration-tests:
    name: "Estágio 3: Testes de Integração & Outbox Pattern"
    needs: stage-2-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './app_build/package.json'

      - name: Install Dependencies
        run: |
          cd app_build
          npm install

      - name: Run Integration Tests (Transactional Outbox & Deduplication)
        run: |
          cd app_build/backend
          npm run test:integration

  stage-4-docker-build:
    name: "Estágio 4: Build de Imagens OCI & Security Scan"
    needs: stage-3-integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./app_build/backend
          push: false
          tags: pulsepass/backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./app_build/frontend
          push: false
          tags: pulsepass/frontend:latest

  stage-5-compose-validation:
    name: "Estágio 5: Validação da Topologia Docker Compose"
    needs: stage-4-docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cd app_build
          docker compose config
